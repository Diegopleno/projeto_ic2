services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: root #DB_USER=root ${DB_USER}
      POSTGRES_PASSWORD: root #DB_PASSWORD=root ${DB_PASSWORD}
      POSTGRES_DB: root #_NAME=root ${DB_PORT}
    ports:
      - "5432:5432"
    volumes:
      - /postgres-data:/var/lib/postgresql/data
healthcheck:
     test: ["CMD-SHELL", "pg_isready -U root"]
     interval: 5s
     timeout: 5s
     retries: 5

pgadmin-compose:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: gui@alura.com
      PGADMIN_DEFAULT_PASSWORD: 123456
#     -  DB_HOST=${DB_NAME}
#     -  DB_USER=${DB_USER}
#     -  DB_PASSWORD=${DB_PASSWORD}
#     -  DB_NAME=${DB_PORT}
    ports:
      - "54321:80"
    depends_on:
      postgres:
        condition: service_healthy

#    environment:
#      -  DB_HOST=postgres
#      -  DB_USER=root
#      -  DB_PASSWORD=root
#      -  DB_NAME=root
#   postgres:
#     condition: service_healthy
# restart: unless-stopped

volumes:
 postgres-data:

