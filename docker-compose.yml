version: '3'
services:
  postgres:
    image: "postgres:17"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root      
    ports:
      - "5432:5432"
    volumes:
      - /postgres-data:/var/lib/postgresql/data  
  healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin-compose:
    image: dpage/pgadmin4
    environment:
#      PGADMIN_DEFAULT_EMAIL: "gui@alura.com"
#      PGADMIN_DEFAULT_PASSWORD: "123456"
      -  DB_HOST=${DB_NAME}
      -  DB_USER=${DB_USER}
      -  DB_PASSWORD=${DB_PASSWORD}
      -  DB_NAME=${DB_PORT}
    ports:
      - "54321:80"
    depends_on:
      - postgres
#    environment:
#      -  DB_HOST=postgres
#      -  DB_USER=root
#      -  DB_PASSWORD=root
#      -  DB_NAME=root
    postgres:
      condition: service_healthy
  restart: unless-stopped

volumes:
  postgres-data:

