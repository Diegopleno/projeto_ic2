name: Go CI

on:
  push:
    branches: [ Aula_1 ]
  pull_request:
    branches: [ Aula_1 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Start DB
        run: |
          docker compose build
          docker compose up -d
          
      - name: Wait for Postgres
        run: |
          timeout 30s bash -c "until docker compose exec -T postgres pg_isready -U root; do sleep 1; done"

      - name: Wait for DB to be ready (opcional, mas evita falhas)
        run: sleep 10

      - name: Run tests
        run: go test ./... -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v ./...