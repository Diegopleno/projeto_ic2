name: Go CI

on:
  push:
    branches: [ Aula_1 ]
  pull_request:
    branches: [ Aula_1 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Docker Compose v2 (if needed)
        run: |
          # docker compose v2 já vem pré-instalado no ubuntu-latest
          docker compose version || echo "docker compose não disponível"

      - name: Build and start DB
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for DB to be ready (opcional, mas evita falhas)
        run: sleep 10

      - name: Run tests
        run: go test ./... -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v ./...