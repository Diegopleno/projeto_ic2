name: Go

on:
  push:
    branches: [ Aula_1 ]
  pull_request:
    branches: [ Aula_1 ]

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.20', '1.21', '1.22']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
        cache: true
        
    - name: Start dependencies
      run: |
        docker compose version
        docker compose up -d --build
      
    - name: Test
      run: go test ./... -v
      
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']

      steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'        # ou matrix se quiser testar várias versões
          cache: true

      - name: Build
        run: go build -v ./...