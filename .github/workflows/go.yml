name: Go CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23', '>=1.23']  # versões reais/suportadas (removi 1.17/1.18 por serem EOL)
        os: ['ubuntu-latest', 'ubuntu-22.04']           # 18.04 morreu; use 22.04 como "antigo" compatível
        exclude:                                        # opcional: evite combinações muito antigas se quiser
          - go-version: '>=1.23'
            os: 'ubuntu-22.04'
    steps:
      - uses: actions/checkout@v4  # atualizado

      - name: Set up Go
        uses: actions/setup-go@v6   # v6 é atual em 2026, suporta '>=1.xx' perfeitamente
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cleanup docker
        run: |
          docker compose down -v || true
          docker volume prune -f || true

      - name: Start DB
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for DB ready
        run: |
          timeout 60s bash -c "until docker compose exec -T postgres pg_isready -U root; do echo 'Waiting...'; sleep 2; done"
          echo "Postgres ready!"

      - name: Run tests
        run: go test ./... -v   # melhor: roda todos os testes (não só main_test.go)

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-22.04']  # mesma matrix de OS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'   # fixe uma versão estável para build (ou use matrix se quiser)
          cache: true

      - name: Build
        run: go build -v ./...   # ./... é melhor que só main.go